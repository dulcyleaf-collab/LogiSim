<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LogiSim | Simulação de Operações Logísticas</title>
<style>
:root {
  --bg:#0b1220;
  --panel:#121d2e;
  --panel2:#18263a;
  --line:#2a3a50;
  --text:#edf3fb;
  --muted:#9fb0c5;
  --orange:#f97316;
  --green:#22c55e;
  --red:#ef4444;
  --blue:#60a5fa;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
}
button,input,select { font:inherit; }
button {
  cursor:pointer;
  border:0;
  border-radius:9px;
  padding:10px 14px;
  font-weight:700;
  background:var(--orange);
  color:#111827;
}
button:hover { filter:brightness(1.08); }
button:disabled { opacity:.45; cursor:not-allowed; }
.secondary {
  background:#24354b;
  color:var(--text);
  border:1px solid var(--line);
}
.danger { background:#7f1d1d; color:#fff; }
.good { background:#14532d; color:#dcfce7; }
.wrap { max-width:1200px; margin:auto; padding:22px; }
header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  flex-wrap:wrap;
  padding:18px 22px;
  border-bottom:1px solid var(--line);
  background:#0e1726;
  position:sticky;
  top:0;
  z-index:3;
}
.brand { display:flex; align-items:center; gap:12px; }
.logo {
  width:42px;
  height:42px;
  border-radius:12px;
  background:var(--orange);
  color:#111827;
  display:grid;
  place-items:center;
  font-weight:900;
  font-size:20px;
}
.brand h1 { font-size:20px; margin:0; }
.brand p { margin:0; color:var(--muted); font-size:12px; }
.head-actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.pill {
  border:1px solid var(--line);
  border-radius:99px;
  padding:6px 10px;
  color:var(--muted);
  font-size:12px;
}
.layout {
  display:grid;
  grid-template-columns:235px 1fr;
  gap:20px;
  margin-top:22px;
}
.sidebar,.panel,.card {
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:15px;
}
.sidebar {
  padding:12px;
  height:max-content;
  position:sticky;
  top:100px;
}
.navbtn {
  display:flex;
  gap:10px;
  align-items:center;
  width:100%;
  text-align:left;
  background:transparent;
  color:var(--muted);
  margin:3px 0;
  border:1px solid transparent;
}
.navbtn.active {
  background:#332519;
  border-color:#9a4b1b;
  color:#ffb47f;
}
.sidebar .small {
  padding:10px;
  color:var(--muted);
  font-size:12px;
}
main { min-width:0; }
.hero {
  padding:22px;
  border-radius:16px;
  background:linear-gradient(120deg,#17283d,#302217);
  border:1px solid #4a3a2d;
  margin-bottom:18px;
}
.hero h2 { margin:0 0 6px; font-size:26px; }
.hero p { margin:0; color:#c4d0df; max-width:780px; }
.row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
.between { justify-content:space-between; }
.grid {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
}
.grid2 {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}
.card { padding:17px; }
.card h3 { margin:0 0 7px; font-size:16px; }
.muted { color:var(--muted); }
.stat { font-size:27px; font-weight:800; margin:3px 0; }
.section-title { margin:22px 0 10px; font-size:18px; }
.progress {
  height:8px;
  background:#25364b;
  border-radius:99px;
  overflow:hidden;
  margin:12px 0;
}
.progress span {
  height:100%;
  display:block;
  background:var(--orange);
  width:0;
  transition:width .2s;
}
.step-list { display:flex; gap:7px; flex-wrap:wrap; margin:16px 0; }
.step {
  padding:7px 10px;
  border-radius:99px;
  border:1px solid var(--line);
  font-size:12px;
  color:var(--muted);
}
.step.active { border-color:var(--orange); background:#382719; color:#ffd2b0; }
.step.done { border-color:#166534; background:#123321; color:#bbf7d0; }
label {
  display:block;
  color:#c9d5e4;
  font-size:13px;
  margin:10px 0 5px;
}
input,select {
  width:100%;
  padding:10px 11px;
  border-radius:8px;
  background:#0b1422;
  color:var(--text);
  border:1px solid #34465c;
  outline:none;
}
input:focus,select:focus { border-color:var(--orange); }
.field { min-width:150px; flex:1; }
.formgrid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}
.actions { display:flex; gap:9px; flex-wrap:wrap; margin-top:16px; }
.feedback {
  margin-top:14px;
  padding:12px;
  border-radius:10px;
  border:1px solid var(--line);
  background:#0d1726;
}
.feedback.success { border-color:#166534; background:#10271b; }
.feedback.error { border-color:#991b1b; background:#2a1518; }
.hidden { display:none!important; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th,td {
  text-align:left;
  padding:11px 9px;
  border-bottom:1px solid var(--line);
  vertical-align:top;
}
th { color:#b9c7d8; font-weight:700; }
td { color:#e0e8f2; }
.tablewrap { overflow-x:auto; }
.tag {
  display:inline-block;
  border-radius:99px;
  padding:3px 8px;
  font-size:11px;
  background:#24354b;
  color:#dbeafe;
}
.tag.green { background:#123321; color:#bbf7d0; }
.tag.red { background:#3b171b; color:#fecaca; }
.notice {
  padding:12px;
  border-radius:10px;
  background:#142338;
  border:1px solid #29435f;
  color:#c8d8eb;
  margin:12px 0;
}
